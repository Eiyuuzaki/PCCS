name: build

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: tidy
        run: go mod tidy

      - name: vet
        run: go vet ./...

      - name: build-arm64
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "arm64"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/pccs ./cmd/pccs
          ls -lh dist/
          file dist/pccs

      - name: pack-module
        run: |
          set -e
          VER="${{ github.ref_name }}"
          OUT="dist/pccs-module-${VER}.zip"
          rm -rf pkg
          mkdir -p pkg/bin
          cp dist/pccs pkg/bin/pccs
          cp module/module.prop pkg/module.prop
          cp module/post-fs-data.sh pkg/post-fs-data.sh
          cp module/service.sh pkg/service.sh
          cp module/uninstall.sh pkg/uninstall.sh
          chmod 644 pkg/module.prop
          chmod 755 pkg/post-fs-data.sh
          chmod 755 pkg/service.sh
          chmod 755 pkg/uninstall.sh
          chmod 755 pkg/bin/pccs
          cd pkg
          zip -r "../${OUT}" .
          cd ..
          ls -lh dist/

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: pccs-arm64
          path: dist/
          if-no-files-found: error